name: Capture record screens (temporary)

on:
  workflow_dispatch:
  push:
    branches: ["claude/project-thread-yngeyx"]
    paths: ["scripts/capture-record.mjs", ".github/workflows/capture-record.yml"]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: |
          sudo apt-get install -y fonts-noto-cjk
          (npx next start -p 3000 &) && npx wait-on http://localhost:3000 -t 60000 || sleep 10
          node scripts/capture-record.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add public/img/record
          git commit -m "고객 축의 기록 화면 캡처 (데모 가상 데이터)" || exit 0
          git push
