name: Capture record screens (temporary)

on:
  workflow_dispatch:
  push:
    branches: ["claude/project-thread-yngeyx"]
    paths: ["scripts/capture-record.mjs", ".github/workflows/capture-record.yml"]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # next/font가 구글 폰트를 받다가 가끔 실패해서 몇 번 다시 시도한다
      - run: for i in 1 2 3; do npm run build && break; sleep 15; done; test -d .next/server
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: |
          sudo apt-get install -y fonts-noto-cjk
          (npx next start -p 3000 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 2; done
          node scripts/capture-record.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add public/img/record
          git commit -m "고객 축의 기록 화면 캡처 (데모 가상 데이터)" || exit 0
          git push
